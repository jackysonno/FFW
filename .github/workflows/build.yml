name: Build Formula Flash APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure gradle.properties exists
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Decode Keystore and Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | head -n 1)
          $APKSIGNER sign --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Prepare Signed Artifact
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned.alignedfiles.apk app/build/outputs/apk/release/formula-flash-signed.apk || mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/formula-flash-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FormulaFlash-Signed-APK
          path: app/build/outputs/apk/release/formula-flash-signed.apk
